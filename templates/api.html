{% extends "base.html" %}

{% block title %}Liste des événements{% endblock %}

{% block content %}
<h1>Liste des événements</h1>


<table>
    <thead>
        <tr>
            <th>Titre</th>
            <th>Date</th>
            <th>Lieu</th>
            <th>Description</th>
          
        </tr>
    </thead>
    <tbody>
        {% for event in events %}
        <tr>
            <td>{{ event.title }}</td>
            <td>{{ event.date }}</td>
            <td>{{ event.location }}</td>
            <td>{{ event.description }}</td>
            
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
